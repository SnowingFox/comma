<!-- Comma app icon. Original artwork for Comma (MIT). 1024 px canvas on the macOS icon grid:
     an 824 px rounded square at 100 px inset, the comma mark centred optically. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2F38"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9E4DA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#5B8CFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#5B8CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <filter id="glyphShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="3"/>
  </g>
  <path d="M512 286A152 152 0 0 1 664 438C664 596 592 716 444 790C424 800 404 782 418 764C478 700 512 646 524 589A152 152 0 0 1 360 438A152 152 0 0 1 512 286Z" fill="url(#glyph)" filter="url(#glyphShadow)" transform="translate(4 -10)"/>
</svg>
