[package]
name = "comma"
description = "Comma: voice keyboard for macOS"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519).
name = "comma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
keyring = { version = "3", features = ["apple-native"] }
comma-voice.workspace = true
# The Comma server client; the providers go through comma-voice.
reqwest.workspace = true
base64.workspace = true
tokio-util.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
wiremock.workspace = true
